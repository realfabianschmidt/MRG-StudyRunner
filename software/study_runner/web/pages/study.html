<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Study Runner</title>
<link rel="stylesheet" href="/static/vendor/iconoir/iconoir.css">
<link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
<div class="ambient"><div class="orb"></div><div class="orb"></div></div>
<div class="study-fullscreen-ui" id="study-fullscreen-ui" hidden>
  <button class="study-fullscreen-btn" id="btn-study-fullscreen" type="button" data-i18n-aria-label="study.fullscreenAria" aria-label="Enter fullscreen" data-i18n-title="study.fullscreenTitle" title="Fullscreen">
    <i class="iconoir-expand"></i>
  </button>
</div>

<!-- One card is visible at a time. Navigation controls appear below. -->
<div id="screen-waiting" class="screen screen--center active">
  <div class="study-waiting-logo"><i class="iconoir-brain"></i></div>
  <h1 class="screen-title" id="study-waiting-title" data-i18n="study.waiting.title">Study will start soon</h1>
  <p class="screen-sub" id="study-waiting-body" data-i18n="study.waiting.body">Please keep this page open.</p>
</div>

<div id="screen-questions" class="screen">
  <div id="q-container"></div>
  <div class="q-nav">
    <button class="q-nav-btn q-nav-btn--back" id="btn-prev" type="button" data-i18n-aria-label="study.prev" aria-label="Previous question">
      <i class="iconoir-nav-arrow-left"></i>
    </button>
    <span class="q-counter" id="q-counter"></span>
    <button class="q-nav-btn q-nav-btn--next" id="btn-next" type="button">
      <span id="btn-next-label" data-i18n="study.next">Next</span>
      <i class="iconoir-nav-arrow-right" id="btn-next-icon"></i>
    </button>
  </div>
</div>

<div id="screen-done" class="screen screen--center">
  <div class="done-icon"><i class="iconoir-check"></i></div>
  <h1 class="screen-title" data-i18n="study.done.title">Thank you!</h1>
  <p class="screen-sub"><span data-i18n="study.done.sub1">Your answers have been saved.</span><br><span data-i18n="study.done.sub2">You can now put the device down.</span></p>
</div>

<div class="study-progress-bar" id="study-progress-bar" hidden>
  <div class="study-progress-fill" id="study-progress-fill"></div>
</div>

<script type="module" src="/static/scripts/study-controller.js"></script>
</body>
</html>
