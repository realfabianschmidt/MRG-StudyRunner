<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Study Runner Camera Preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir/css/iconoir.css">
<link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
<div class="screen screen--center active">
  <div class="camera-preview-page">
    <div>
      <span class="dashboard-kicker">Tablet camera</span>
      <h1 class="screen-title">Emotion preview</h1>
      <p class="screen-sub" id="camera-preview-message">Start preview to test camera permission, frame upload and emotion analysis.</p>
    </div>
    <div class="camera-preview-video-shell" id="camera-preview-video"></div>
    <div class="camera-preview-result" id="camera-preview-result">No frame sent yet.</div>
    <div class="settings-toolbar">
      <button class="btn-primary" id="btn-camera-preview-start" type="button">Start preview</button>
      <button class="btn-secondary" id="btn-camera-preview-stop" type="button" disabled>Stop</button>
    </div>
  </div>
</div>
<script type="module" src="/static/scripts/camera-preview.js"></script>
</body>
</html>
