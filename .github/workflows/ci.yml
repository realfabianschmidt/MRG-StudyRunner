name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"
      - "feature/study-runner-manager"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Study Runner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r software/requirements.txt -r release_tools/pyinstaller/requirements-build.txt

      - name: Check release JavaScript syntax
        run: |
          node --check release_tools/verify-release-version.mjs
          node --check release_tools/release-study-runner.mjs

      - name: Check release Python helpers
        run: python -m py_compile release_tools/package_python_onedir.py release_tools/write_python_update_key.py release_tools/build_python_update_manifest.py release_tools/build_python_onedir.py tools/study_runner_manager.py

      - name: Verify Python app version
        shell: bash
        run: |
          version="$(python -c "from pathlib import Path; import re; text = Path('software/study_runner/version.py').read_text(encoding='utf-8'); print(re.search(r'^__version__\\s*=\\s*\"([^\"]+)\"', text, re.M).group(1))")"
          node release_tools/verify-release-version.mjs "app-v${version}"

      - name: Run Python tests
        run: python -m pytest software

      - name: Build Python one-dir package
        run: python release_tools/build_python_onedir.py
