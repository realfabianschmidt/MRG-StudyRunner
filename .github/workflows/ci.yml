name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Study Runner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci
        working-directory: desktop

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r software/requirements.txt -r desktop/build_tools/pyinstaller/requirements-build.txt

      - name: Check desktop JavaScript syntax
        run: |
          node --check desktop/web/main.js
          node --check release_tools/verify-release-version.mjs

      - name: Verify desktop version fields
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          node release_tools/verify-release-version.mjs "app-v${version}"

      - name: Run Python tests
        run: python -m pytest software

      - name: Build desktop sidecar for Tauri checks
        run: npm run build:sidecar
        working-directory: desktop

      - name: Check Tauri Rust crate
        run: cargo check -q
        working-directory: desktop/src-tauri
