name: Release Study Runner

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            python_asset: study-runner-server-windows-x86_64.zip
            manager_asset: study-runner-manager-windows-x86_64.zip
          - label: Linux x64
            platform: ubuntu-24.04
            python_asset: study-runner-server-linux-x86_64.zip
            manager_asset: ""
          - label: macOS Intel
            platform: macos-15-intel
            python_asset: study-runner-server-macos-x86_64.zip
            manager_asset: study-runner-manager-macos-x86_64.zip
          - label: macOS Apple Silicon
            platform: macos-15
            python_asset: study-runner-server-macos-arm64.zip
            manager_asset: study-runner-manager-macos-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify release version
        run: node release_tools/verify-release-version.mjs "$env:GITHUB_REF_NAME"
        if: runner.os == 'Windows'

      - name: Verify release version
        run: node release_tools/verify-release-version.mjs "$GITHUB_REF_NAME"
        if: runner.os != 'Windows'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r software/requirements.txt -r release_tools/pyinstaller/requirements-build.txt

      - name: Verify updater public key
        shell: bash
        env:
          PYTHON_UPDATER_PUBLIC_KEY: ${{ secrets.PYTHON_UPDATER_PUBLIC_KEY || vars.PYTHON_UPDATER_PUBLIC_KEY }}
        run: |
          if [ -z "$PYTHON_UPDATER_PUBLIC_KEY" ]; then
            echo "PYTHON_UPDATER_PUBLIC_KEY is required for packaged update builds." >&2
            echo "Use a GitHub Actions variable or secret for the public Ed25519 key." >&2
            exit 1
          fi

      - name: Write Python updater public key
        env:
          PYTHON_UPDATER_PUBLIC_KEY: ${{ secrets.PYTHON_UPDATER_PUBLIC_KEY || vars.PYTHON_UPDATER_PUBLIC_KEY }}
        run: python release_tools/write-python-update-key.py

      - name: Verify updater signing secret
        shell: bash
        env:
          PYTHON_UPDATER_SIGNING_PRIVATE_KEY: ${{ secrets.PYTHON_UPDATER_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PYTHON_UPDATER_SIGNING_PRIVATE_KEY" ]; then
            echo "PYTHON_UPDATER_SIGNING_PRIVATE_KEY is required to create Python update signatures." >&2
            exit 1
          fi

      - name: Build Python one-dir package
        run: python release_tools/build-python-onedir.py

      - name: Package Python update asset
        run: python release_tools/package-python-onedir.py --source software/dist/study-runner-server --output "${{ matrix.python_asset }}"

      - name: Build manager package
        if: matrix.manager_asset != ''
        run: python release_tools/build-python-onedir.py --spec release_tools/pyinstaller/study_runner_manager_onedir.spec

      - name: Package manager asset
        if: matrix.manager_asset != ''
        run: python release_tools/package-python-onedir.py --source software/dist/study-runner-manager --output "${{ matrix.manager_asset }}"

      - name: Upload Python update workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-update-${{ matrix.python_asset }}
          path: ${{ matrix.python_asset }}
          if-no-files-found: error

      - name: Upload manager workflow artifact
        if: matrix.manager_asset != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-update-${{ matrix.manager_asset }}
          path: ${{ matrix.manager_asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest signing dependency
        run: python -m pip install "cryptography>=42"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: python-update-*
          path: python-update-assets
          merge-multiple: true

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_UPDATER_SIGNING_PRIVATE_KEY: ${{ secrets.PYTHON_UPDATER_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          version="${RELEASE_TAG#app-v}"
          python release_tools/build-python-update-manifest.py \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --asset-dir python-update-assets \
            --output study-runner-python-latest.json
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" python-update-assets/*.zip study-runner-python-latest.json --clobber
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --latest \
              --title "Study Runner $RELEASE_TAG" \
              --notes "Python-only update assets for Study Runner $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" \
              python-update-assets/*.zip \
              study-runner-python-latest.json \
              --verify-tag \
              --latest \
              --title "Study Runner $RELEASE_TAG" \
              --notes "Python-only update assets for Study Runner $RELEASE_TAG."
          fi
