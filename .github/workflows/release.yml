name: Release Study Runner source server

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  native-core:
    name: Build and test the XDF core (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    # Users never compile the core: every release carries one tested build per
    # platform, and the installers download and re-test it. macos-15-intel is
    # GitHub's last Intel image; once it is retired, build x86_64 on macos-15
    # with CMAKE_OSX_ARCHITECTURES=x86_64 and run the tests under Rosetta.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            platform_arch: windows-x64
            library: xdf_core.dll
          - label: macOS Intel
            platform: macos-15-intel
            platform_arch: macos-x64
            library: libxdf_core.dylib
          - label: macOS Apple Silicon
            platform: macos-15
            platform_arch: macos-arm64
            library: libxdf_core.dylib

    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build and recording validation tools
        shell: bash
        run: |
          python -m pip install --upgrade --constraint software/constraints/py312-bootstrap.txt pip
          # The runner's own CMake knows its Visual Studio version; the older pinned
          # CMake from pip falls back to NMake on Windows and cannot configure.
          python -m pip install \
            --constraint software/constraints/py312-common.txt \
            "pylsl==1.18.2" "pyxdf==1.16.8" "numpy==1.26.4"

      - name: Build, CTest, and synthetic-XDF-test the core
        run: python tools/setup_recording_worker.py --require-canonical --json

      - name: Run native writer, merge, and synthetic LSL smoke tests
        working-directory: software
        env:
          STUDY_RUNNER_XDF_CORE_TEST: ${{ github.workspace }}/software/.build/xdf_core/${{ matrix.platform_arch }}/${{ matrix.library }}
        run: python -m unittest -v tests.test_hybrid_recording_worker.NativeCoreSmokeTests

      - name: Verify the macOS architecture and minimum version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          library="software/.build/xdf_core/${{ matrix.platform_arch }}/${{ matrix.library }}"
          test "$(lipo -archs "$library")" = "$(uname -m)"
          otool -l "$library" | grep -A4 LC_BUILD_VERSION | grep -q "minos 13.0"
          # Apple Silicon only loads signed code; the linker's ad-hoc signature
          # suffices for ctypes, so no Apple Developer account is involved.
          if [[ "$(uname -m)" == "arm64" ]]; then
            codesign --verify "$library"
          fi

      - name: Package the tested core
        run: python tools/setup_recording_worker.py --package release-cores/study-runner-xdf-core-${{ matrix.platform_arch }}.zip --json

      - name: Upload the core workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xdf-core-${{ matrix.platform_arch }}
          path: release-cores/study-runner-xdf-core-${{ matrix.platform_arch }}.zip
          if-no-files-found: error
          retention-days: 14

  source:
    name: Build source release
    needs: native-core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download the tested XDF cores
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: xdf-core-*
          merge-multiple: true
          path: core-assets

      - name: Verify release version
        run: node release_tools/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Build auditable source archives and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#app-v}"
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          python release_tools/build_source_release.py \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$release_commit" \
            --core-assets core-assets \
            --output-dir release-assets

      - name: Verify archives, cores, and checksums
        run: python release_tools/build_source_release.py --verify-output release-assets

      - name: Upload source workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-runner-source-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  source-quality:
    name: Source regression suite (Linux, non-recording)
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Download source workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: study-runner-source-release
          path: release-assets

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify and extract tagged source
        shell: bash
        run: |
          python release-assets/verify_release_assets.py
          mkdir source-release
          tar -xzf release-assets/study-runner-source.tar.gz -C source-release
          source_root="$(find source-release -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$source_root" ] || [ ! -f "$source_root/software/server.py" ]; then
            echo "The source archive has no usable Study Runner root." >&2
            exit 1
          fi
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Install non-recording validation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade \
            --constraint "$SOURCE_ROOT/software/constraints/py312-bootstrap.txt" pip
          python -m pip install \
            --constraint "$SOURCE_ROOT/software/constraints/py312-common.txt" \
            --constraint "$SOURCE_ROOT/software/constraints/py312-local-emotion.txt" \
            pytest -r "$SOURCE_ROOT/software/requirements.txt"

      - name: Run Python, JavaScript, schema, and release-contract tests
        shell: bash
        run: |
          python -m pytest "$SOURCE_ROOT/software"
          (
            cd "$SOURCE_ROOT"
            python -m unittest -v release_tools.tests.test_build_source_release
            node --test software/tests/js/*.test.mjs
          )

  recording-acceptance:
    name: User install without a compiler (${{ matrix.label }})
    needs: source
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            archive: study-runner-source.zip
            core_path: software/.build/xdf_core/windows-x64/xdf_core.dll
            venv_python: .venv/Scripts/python.exe
          - label: macOS Intel
            platform: macos-15-intel
            archive: study-runner-source.tar.gz
            core_path: software/.build/xdf_core/macos-x64/libxdf_core.dylib
            venv_python: .venv/bin/python
          - label: macOS Apple Silicon
            platform: macos-15
            archive: study-runner-source.tar.gz
            core_path: software/.build/xdf_core/macos-arm64/libxdf_core.dylib
            venv_python: .venv/bin/python

    steps:
      - name: Download source workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: study-runner-source-release
          path: release-assets

      - name: Setup Python for checksum verification only
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify artifact checksums
        shell: bash
        working-directory: release-assets
        run: python verify_release_assets.py

      - name: Extract tagged source into a folder with spaces
        shell: bash
        run: |
          mkdir "My Studies"
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            python -m zipfile -e "release-assets/${{ matrix.archive }}" "My Studies"
          else
            tar -xzf "release-assets/${{ matrix.archive }}" -C "My Studies"
          fi

      - name: Locate extracted source
        id: source-root
        shell: bash
        run: |
          source_root="$(find "My Studies" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$source_root" ] || [ ! -f "$source_root/software/server.py" ]; then
            echo "The source archive has no usable Study Runner root." >&2
            exit 1
          fi
          if [ -e "$source_root/software/.build" ]; then
            echo "Generated native build output leaked into the source archive." >&2
            exit 1
          fi
          test -f "$source_root/study-runner-release.json"
          echo "path=$source_root" >> "$GITHUB_OUTPUT"

      # The release is not published yet, so the installers read the cores from
      # the workflow artifact instead of GitHub Releases. Everything else,
      # including the SHA-256 check against study-runner-release.json and the
      # on-machine XDF test, is the real user path.
      - name: Run the real Windows first-install workflow
        if: runner.os == 'Windows'
        working-directory: ${{ steps.source-root.outputs.path }}
        shell: cmd
        env:
          STUDY_RUNNER_CORE_ASSET_DIR: ${{ github.workspace }}\release-assets
        run: tools\install-windows.cmd

      - name: Run the real macOS first-install workflow without a compiler
        if: runner.os == 'macOS'
        working-directory: ${{ steps.source-root.outputs.path }}
        shell: bash
        env:
          STUDY_RUNNER_CORE_ASSET_DIR: ${{ github.workspace }}/release-assets
          # Any accidental xcrun/clang call fails instead of silently compiling.
          DEVELOPER_DIR: /nonexistent-toolchain
        run: |
          bash -n tools/install-macos.sh
          bash tools/install-macos.sh
          test "$(.venv/bin/python -c 'import platform, sys; print(f"{sys.version_info.major}.{sys.version_info.minor}|{platform.machine()}")')" = "3.12|$(uname -m)"

      - name: Verify the installed core is the tested release build
        shell: bash
        working-directory: ${{ steps.source-root.outputs.path }}
        run: |
          test -f "${{ matrix.core_path }}"
          test ! -e .venv/bin/cmake
          test ! -e .venv/Scripts/cmake.exe
          "${{ matrix.venv_python }}" -c "import json, pathlib, sys; m = json.loads((pathlib.Path(sys.argv[1]).parent / 'worker-build.json').read_text()); assert m['source'] == 'prebuilt', m['source']; assert m['tests']['local_synthetic_xdf_smoke'] == 'passed'" "${{ matrix.core_path }}"

      - name: Run native writer, merge, and synthetic LSL smoke tests
        shell: bash
        env:
          STUDY_RUNNER_XDF_CORE_TEST: ${{ github.workspace }}/${{ steps.source-root.outputs.path }}/${{ matrix.core_path }}
        run: |
          cd "${{ steps.source-root.outputs.path }}/software"
          "../${{ matrix.venv_python }}" -m unittest -v tests.test_hybrid_recording_worker.NativeCoreSmokeTests

      - name: Rerun the installer to confirm it is repeatable
        shell: bash
        working-directory: ${{ steps.source-root.outputs.path }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //c "tools\\install-windows.cmd" | tee install-again.log
          else
            bash tools/install-macos.sh | tee install-again.log
          fi
          grep -q "Reusing the current verified XDF recording core." install-again.log

      - name: Run the real Windows daily-start self-check
        if: runner.os == 'Windows'
        working-directory: ${{ steps.source-root.outputs.path }}
        shell: cmd
        env:
          STUDY_RUNNER_DATA_DIR: ${{ runner.temp }}/study-runner-self-check
          STUDY_RUNNER_DISABLE_HARDWARE: "1"
          STUDY_RUNNER_DISABLE_BACKGROUND: "1"
        run: tools\start-windows.cmd -SelfCheck

      - name: Run the real macOS daily-start self-check
        if: runner.os == 'macOS'
        working-directory: ${{ steps.source-root.outputs.path }}
        shell: bash
        env:
          STUDY_RUNNER_DATA_DIR: ${{ runner.temp }}/study-runner-self-check
          STUDY_RUNNER_DISABLE_HARDWARE: "1"
          STUDY_RUNNER_DISABLE_BACKGROUND: "1"
        run: bash tools/start-macos.sh --self-check

      - name: Verify the macOS desktop-shortcut contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "${{ steps.source-root.outputs.path }}/software"
          "../${{ matrix.venv_python }}" -m unittest -v tests.test_shortcut_service

  publish:
    name: Publish source release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - source
      - source-quality
      - recording-acceptance
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: study-runner-source-release
          path: release-assets

      - name: Publish completed source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          assets=(
            release-assets/study-runner-source.zip
            release-assets/study-runner-source.tar.gz
            release-assets/study-runner-xdf-core-windows-x64.zip
            release-assets/study-runner-xdf-core-macos-x64.zip
            release-assets/study-runner-xdf-core-macos-arm64.zip
            release-assets/study-runner-source-release.json
            release-assets/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --latest \
              --title "Study Runner ${RELEASE_TAG#app-v}" \
              --notes-file release-assets/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              "${assets[@]}" \
              --verify-tag \
              --latest \
              --title "Study Runner ${RELEASE_TAG#app-v}" \
              --notes-file release-assets/RELEASE_NOTES.md
          fi
